<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragonfly Health</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header Top -->
  <div class="header-top">
    <div class="header-top__greenbar"></div>
    <div class="header-top__links">
      <a href="https://df.deltaetools.com/Account/Login" target="_blank" rel="noopener">RX Login</a>
      <a href="https://www2.dmetrack.com/" target="_blank" rel="noopener">DME Login</a>
      <a href="https://www.deltacarerx.com/" target="_blank" rel="noopener">Delta Care Rx</a>
    </div>
  </div>

  <!-- Header Main -->
  <header class="header-main">
    <div class="header-main__inner">
      <a href="/" class="header-main__logo" aria-label="Dragonfly Health home">
        <img src="assets/logo.svg" alt="Dragonfly Health" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-fallback',textContent:'Dragonfly Health'}))" />
      </a>

      <nav class="header-main__nav" aria-label="Primary">
        <ul>
          <li><a href="/" class="is-active">Home</a></li>
          <li><a href="/who-we-are">Who We Are</a></li>
          <li><a href="/what-we-do">What We Do</a></li>
          <li><a href="/who-we-serve">Who We Serve</a></li>
          <li><a href="/resources">Resources</a></li>
          <li><a href="/contact">Contact Us</a></li>
        </ul>
      </nav>

      <div class="header-main__actions">
        <button class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <a href="/schedule-demo" class="btn-primary">Schedule Demo</a>
      </div>
    </div>
  </header>
</body>
</html>
